# Integración continua: con cada push y cada pull request, GitHub compila el
# proyecto y pasa los tests contra un PostgreSQL de usar y tirar.
name: CI

on:
  push:
  pull_request:

jobs:
  compilar:
    runs-on: ubuntu-latest

    # La misma base de datos que compose.yaml; los tests del servicio la necesitan.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: crud
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar y pasar los tests
        run: ./mvnw -B verify
