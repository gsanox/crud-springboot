spring.application.name=crud

# Conexión a PostgreSQL (se pueden sobrescribir con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/crud}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Hibernate
# update: crea o modifica las tablas a partir de las entidades (solo para desarrollo)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Caché: "simple" = un Map en memoria por cada caché (ver config/CacheConfig.java)
spring.cache.type=simple
